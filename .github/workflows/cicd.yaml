# CICD using GitHub actions
name: CI/CD

# Exclude the workflow to run on changes to the helm chart
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:

  # Job 1 — Build and Test
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go 1.22
      uses: actions/setup-go@v5        # ✅ updated from v2
      with:
        go-version: 1.22
        cache: false                   # ✅ added to avoid cache conflicts

    - name: Build
      run: go build -o go-web-app

    - name: Test
      run: go test ./...

  # Job 2 — Code Quality
  code-quality:
    runs-on: ubuntu-latest
    needs: build                       # ✅ added — runs after build passes
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go 1.22            # ✅ added — golangci-lint needs Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22
        cache: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8
        args: --timeout=5m             # ✅ added — prevents timeout on large repos

  # Job 3 — Docker Build and Push
  push:
    runs-on: ubuntu-latest
    needs: [build, code-quality]       # ✅ updated — waits for both jobs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3   # ✅ updated from v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push action
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}

  # Job 4 — Update Helm Chart Tag
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: push                        # runs after docker push
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-web-app-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "bibhishandhagate@gmail.com"   
        git config --global user.name "Bibhishan Dhagate"             
        git add helm/go-web-app-chart/values.yaml
        git commit -m "Update tag in Helm chart to ${{ github.run_id }}"
        git push
